name: Build German dialogue and grammar game hotfix
on:
  workflow_dispatch:
    inputs:
      expectedArchiveSha256:
        description: Locally reviewed 7.3.14 fallback archive SHA256
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: game-german-text-7.3.14
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.8.10'
      - name: Reproduce the reviewed complete fallback
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expectedArchiveSha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_ARCHIVE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid reviewed checksum.' }
          python tools/prepare_german_hotfix.py --ci --expected-archive-sha256 $env:EXPECTED_ARCHIVE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Fallback reproduction failed.' }
      - name: Upload verified fallback and manual add-on ZIP to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = 'dist/release-game-7.3.14-channel'
          python tools/verify_release_parity.py --release-dir $directory --archive-only
          if ($LASTEXITCODE -ne 0) { throw 'Release parity proof is missing or stale.' }
          $draft = gh release view v7.3.14 --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Expected unpublished 7.3.14 draft.' }
          $manifest = Get-Content "$directory/update.json" -Raw | ConvertFrom-Json
          $deltaInfo = $manifest.gameHotfixesV2 | Where-Object fromVersion -eq '7.3.13' | Select-Object -First 1
          if (-not $deltaInfo) { throw 'New launcher V2 delta is missing.' }
          $deltaName = [IO.Path]::GetFileName(([Uri]$deltaInfo.url).AbsolutePath)
          gh release upload v7.3.14 "$directory/Reborn-AllGen-0.9.9.zip" "$directory/Reborn-7.3.14-Zusatzdateien.zip" "$directory/$deltaName" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          $assets = gh release view v7.3.14 --json assets | ConvertFrom-Json
          foreach ($name in @('Reborn-AllGen-0.9.9.zip', 'Reborn-7.3.14-Zusatzdateien.zip', $deltaName)) {
            $asset = $assets.assets | Where-Object name -eq $name
            if ($asset.state -ne 'uploaded') { throw "Draft asset was not uploaded: $name" }
          }
          $fallback = $assets.assets | Where-Object name -eq 'Reborn-AllGen-0.9.9.zip'
          if ($fallback.size -ne $manifest.game.size -or $fallback.digest -ne ('sha256:' + $manifest.game.sha256)) { throw 'Uploaded fallback differs from reviewed bytes.' }
          $deltaAsset = $assets.assets | Where-Object name -eq $deltaName
          if ($deltaAsset.size -ne $deltaInfo.size -or $deltaAsset.digest -ne ('sha256:' + $deltaInfo.sha256)) { throw 'Uploaded V2 delta differs from reviewed bytes.' }
          Write-Output 'Verified fallback uploaded. Release and update channel remain unpublished.'
