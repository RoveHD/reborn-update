name: Build game catch hotfix
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed game hotfix to prepare
        type: choice
        default: '7.3.5'
        options: ['7.3.2', '7.3.5', '7.3.9']
      expectedArchiveSha256:
        description: Verified local full archive SHA256 (required for 7.3.9)
        type: string
        required: false
        default: '0d9bfe384cac9ffd34f8fbf48bbeb27c7dafbe2a730bb65112a5c23fcc98df0f'

permissions:
  contents: write

concurrency:
  group: game-catch-hotfix-${{ inputs.version || '7.3.2' }}
  cancel-in-progress: false

jobs:
  package:
    if: inputs.version == '7.3.2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify complete game package
        run: python3 tools/prepare_catch_hotfix.py
      - name: Upload verified files to draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v7.3.2 --json isDraft > /tmp/catch-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/catch-release.json"))["isDraft"], "Release already public"'
          else
            gh release create v7.3.2 --target "$RELEASE_COMMIT" --draft --title "Spielhotfix 7.3.2 - Ballwurf-Absturz" --notes-file dist/release-game-7.3.2/patchnotes.txt
          fi
          gh release upload v7.3.2 dist/release-game-7.3.2/* --clobber
          gh release view v7.3.2 --json assets > /tmp/catch-assets.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          assets = {a['name']: a for a in json.load(open('/tmp/catch-assets.json'))['assets']}
          for path in Path('dist/release-game-7.3.2').iterdir():
              digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              asset = assets[path.name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + digest, path.name
          print('Draft assets verified. Live update channel unchanged.')
          PY
  gate_package:
    if: inputs.version == '7.3.5'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8.10'
      - name: Reproduce exact verified full fallback archive
        run: python tools/build_gate_hotfix_ci.py
      - name: Upload full fallback to existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view v7.3.5 --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Expected unpublished release draft.' }
          gh release upload v7.3.5 dist/release-game-7.3.5/Reborn-AllGen-0.9.9.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed.' }
          $assets = gh release view v7.3.5 --json assets | ConvertFrom-Json
          $asset = $assets.assets | Where-Object name -eq 'Reborn-AllGen-0.9.9.zip'
          if ($asset.state -ne 'uploaded' -or $asset.size -ne 1476961003 -or $asset.digest -ne 'sha256:9e1fa3b885e051db90ef1b0973d17a56024c687ee25094231b6842c0a9110b54') { throw 'Uploaded archive does not match reviewed bytes.' }
          Write-Output 'Exact full fallback uploaded. Release and update channel remain unpublished.'
  glitter_package:
    if: inputs.version == '7.3.9'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8.10'
      - name: Reproduce exact reviewed glitter-ball fallback archive
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expectedArchiveSha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_ARCHIVE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Provide the reviewed local archive SHA256.' }
          python tools/prepare_glitter_hotfix.py --ci --expected-archive-sha256 $env:EXPECTED_ARCHIVE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Exact fallback reproduction failed.' }
      - name: Upload exact full fallback to existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view v7.3.9 --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Expected unpublished 7.3.9 draft.' }
          $manifest = Get-Content dist/release-game-7.3.9/update.json -Raw | ConvertFrom-Json
          gh release upload v7.3.9 dist/release-game-7.3.9/Reborn-AllGen-0.9.9.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed.' }
          $assets = gh release view v7.3.9 --json assets | ConvertFrom-Json
          $asset = $assets.assets | Where-Object name -eq 'Reborn-AllGen-0.9.9.zip'
          if ($asset.state -ne 'uploaded' -or $asset.size -ne $manifest.game.size -or $asset.digest -ne ('sha256:' + $manifest.game.sha256)) { throw 'Uploaded archive differs from reviewed bytes.' }
          Write-Output 'Exact full fallback uploaded. Release and update channel remain unpublished.'
