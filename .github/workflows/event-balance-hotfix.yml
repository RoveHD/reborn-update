name: Build event balance hotfix
on:
  workflow_dispatch:
    inputs:
      expectedArchiveSha256:
        description: Verified local 7.3.10 fallback archive SHA256
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: game-event-balance-7.3.10
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.8.10'
      - name: Reproduce the reviewed complete fallback
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expectedArchiveSha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_ARCHIVE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid reviewed checksum.' }
          python tools/prepare_event_balance_hotfix.py --ci --expected-archive-sha256 $env:EXPECTED_ARCHIVE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Fallback reproduction failed.' }
      - name: Upload verified full fallback to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view v7.3.10 --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Expected unpublished 7.3.10 draft.' }
          gh release upload v7.3.10 dist/release-game-7.3.10/Reborn-AllGen-0.9.9.zip
          if ($LASTEXITCODE -ne 0) { throw 'Fallback upload failed.' }
          $manifest = Get-Content dist/release-game-7.3.10/update.json -Raw | ConvertFrom-Json
          $assets = gh release view v7.3.10 --json assets | ConvertFrom-Json
          $asset = $assets.assets | Where-Object name -eq 'Reborn-AllGen-0.9.9.zip'
          if ($asset.state -ne 'uploaded' -or $asset.size -ne $manifest.game.size -or $asset.digest -ne ('sha256:' + $manifest.game.sha256)) { throw 'Uploaded fallback differs from reviewed bytes.' }
          Write-Output 'Verified full fallback uploaded; release and update channel remain unpublished.'
